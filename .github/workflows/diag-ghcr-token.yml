name: Diag GHCR Token
on:
  workflow_dispatch:

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      - name: Test GHCR_PULL_TOKEN can authenticate and pull
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GHCR_PULL_TOKEN:-}" ]; then
            echo "RESULT: secret is EMPTY or missing"
            exit 1
          fi
          echo "Token length: ${#GHCR_PULL_TOKEN}"
          if echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u punkouter26 --password-stdin; then
            echo "RESULT: LOGIN OK"
          else
            echo "RESULT: LOGIN FAILED (token invalid/expired)"
            exit 1
          fi
          if docker pull ghcr.io/punkouter26/pomemevideo:latest; then
            echo "RESULT: PULL OK (token has read:packages for this image)"
          else
            echo "RESULT: PULL FAILED (token lacks package read access)"
            exit 1
          fi
