name: CI

# The push/PR gate, and nothing else.
#
# One runner, no service containers, fully deterministic: a red build here always means the
# code is wrong, never that a container was slow to come up. Everything that needs Azurite or
# a browser lives in ci-full.yml and is run on demand.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PoMemeVideo.slnx

      # TreatWarningsAsErrors is on, so this is the lint step too.
      - name: Build (0 warnings, 0 errors)
        run: dotnet build PoMemeVideo.slnx --no-restore --configuration Release

      - name: Check test budgets
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/check-test-budgets.ps1

      - name: Unit tests
        run: dotnet test tests/PoMemeVideo.UnitTests --no-build --configuration Release --verbosity normal
