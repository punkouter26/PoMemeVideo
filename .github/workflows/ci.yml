name: CI

# Two tiers, deliberately.
#
# `build-and-test` is the gate: it runs on every push and PR, needs one runner and no services,
# and is fully deterministic — a red build here always means the code is wrong.
#
# The integration / API-E2E / UI-E2E jobs each stand up an Azurite service container, and the UI
# one also publishes the app, boots it and installs a browser. They cost three extra runners and
# several minutes on a change that a unit test could have caught, and their failures are as often
# environmental as real. They are therefore `workflow_dispatch`-only: run the workflow manually
# (Actions → CI → Run workflow) to get the full suite, e.g. before a release or after touching
# storage, auth or the render pipeline. Nothing about them is deleted — only unhooked from push.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PoMemeVideo.slnx

      - name: Build (0 warnings, 0 errors)
        run: dotnet build PoMemeVideo.slnx --no-restore --configuration Release

      - name: Check test budgets
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/check-test-budgets.ps1

      - name: Unit tests
        run: dotnet test tests/PoMemeVideo.UnitTests --no-build --configuration Release --verbosity normal

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        options: >-
          --health-cmd "nc -z localhost 10000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PoMemeVideo.slnx

      - name: Build
        run: dotnet build PoMemeVideo.slnx --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test tests/PoMemeVideo.IntegrationTests --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__AzureStorage: "UseDevelopmentStorage=true"

  api-e2e-tests:
    name: API E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        options: >-
          --health-cmd "nc -z localhost 10000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PoMemeVideo.slnx

      - name: Build
        run: dotnet build PoMemeVideo.slnx --no-restore --configuration Release

      - name: API E2E tests
        run: dotnet test tests/PoMemeVideo.E2EAPI --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__AzureStorage: "UseDevelopmentStorage=true"

  ui-e2e-tests:
    name: UI E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        options: >-
          --health-cmd "nc -z localhost 10000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PoMemeVideo.slnx

      - name: Build
        run: dotnet build PoMemeVideo.slnx --no-restore --configuration Release

      # Must be `publish`, not `run`. Outside Development the Blazor client's static assets
      # are only laid into the API's wwwroot by publish, so `dotnet run --no-build` serves the
      # API fine but answers 404 for index.html — every page navigation then fails.
      - name: Publish
        run: dotnet publish src/PoMemeVideo.Api/PoMemeVideo.Api.csproj -c Release -o publish

      # The suite drives a real browser against a real instance, so one has to be running.
      # Without this the tests silently no-op: every one of them returns early when
      # E2E_BASE_URL is unset, which reads as a pass.
      - name: Start the app
        working-directory: publish
        run: |
          set -euo pipefail
          dotnet PoMemeVideo.Api.dll --urls "http://localhost:7000" &
          echo $! > ../app.pid
        env:
          ASPNETCORE_ENVIRONMENT: Test
          ConnectionStrings__AzureStorage: "UseDevelopmentStorage=true"
          ConnectionStrings__AzureBlobStorage: "UseDevelopmentStorage=true"
          ConnectionStrings__AzureTableStorage: "UseDevelopmentStorage=true"
          KeyVault__Uri: ""

      - name: Wait for the app to answer
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:7000/health/live || true)" = "200" ]; then
              echo "App is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not answer /health/live within 120s"
          exit 1

      - name: Install Playwright browsers
        run: pwsh tests/PoMemeVideo.E2EUI/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: UI E2E tests
        run: dotnet test tests/PoMemeVideo.E2EUI --no-build --configuration Release --verbosity normal
        env:
          E2E_BASE_URL: http://localhost:7000/

      - name: Stop the app
        if: always()
        run: kill "$(cat app.pid)" || true
