name: Build and Deploy PoMemeVideo

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-pomemevideo-master
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pomemevideo
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'app-pomemevideo' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'PoMemeVideo' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Secretless OIDC login via the federated credential on the
      # PoShared deployment app registration (subject: refs/heads/master).
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az webapp config container set` does not reliably persist
      # DOCKER_REGISTRY_SERVER_PASSWORD (observed null after set), which causes
      # ImagePullUnauthorizedFailure at runtime. Write the registry credentials
      # as explicit app settings instead, then point linuxFxVersion at the new
      # image. --query suppresses setting values from the job log.
      # Key Vault auth uses the app's system-assigned managed identity
      # (Key Vault Secrets access on kv-poshared) — no AZURE_CLIENT_ID needed.
      - name: Configure container image and registry credentials
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --settings \
              DOCKER_REGISTRY_SERVER_URL=https://ghcr.io \
              DOCKER_REGISTRY_SERVER_USERNAME=${{ github.repository_owner }} \
              DOCKER_REGISTRY_SERVER_PASSWORD="${GHCR_PULL_TOKEN}" \
            --query "[].name" -o tsv

          az webapp config set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --linux-fx-version "DOCKER|${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --query "linuxFxVersion" -o tsv

          az webapp restart \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}"

      - name: Health check gate
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/health/live"
          echo "Checking ${HEALTH_URL} for HTTP 200"

          for attempt in {1..20}; do
            status_code="$(curl -sS -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || true)"
            echo "Attempt ${attempt}/20: HTTP ${status_code}"

            if [ "${status_code}" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi

            sleep 15
          done

          echo "Health check failed after 20 attempts. Dumping container state:"
          az webapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --query '{state:state, linuxFxVersion:siteConfig.linuxFxVersion}'
          exit 1

      - name: Smoke test frontend and /diag
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${WEBAPP_NAME}.azurewebsites.net"
          fail=0

          # ── 1. Shell responds ────────────────────────────────────────────────
          home_body="$(mktemp)"
          home_status="$(curl -sS -o "${home_body}" -w "%{http_code}" "${BASE_URL}/")"
          echo "GET / -> HTTP ${home_status}"
          [ "${home_status}" = "200" ] || { echo "::error::Home page did not return 200."; fail=1; }

          # ── 2. Blazor render tree initialization ─────────────────────────────
          # The WASM host div and the framework bootstrap script must both be present,
          # and the scoped-CSS bundle must be linked or every .razor.css rule is dead.
          grep -q 'id="app"' "${home_body}" \
            || { echo "::error::Blazor root component host (#app) missing from index.html."; fail=1; }
          grep -q '_framework/blazor.webassembly.js' "${home_body}" \
            || { echo "::error::Blazor WASM bootstrap script missing — render tree will never initialize."; fail=1; }
          grep -q 'PoMemeVideo.Client.styles.css' "${home_body}" \
            || { echo "::error::Scoped-CSS bundle not linked — component styles will not apply."; fail=1; }

          # The framework manifest must actually be served, not just referenced.
          boot_status="$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}/_framework/blazor.boot.json" || true)"
          echo "GET /_framework/blazor.boot.json -> HTTP ${boot_status}"
          [ "${boot_status}" = "200" ] || { echo "::error::blazor.boot.json not served (HTTP ${boot_status})."; fail=1; }

          # ── 3. /diag reachable AND masking ───────────────────────────────────
          diag_body="$(mktemp)"
          diag_status="$(curl -sS -o "${diag_body}" -w "%{http_code}" "${BASE_URL}/diag")"
          echo "GET /diag -> HTTP ${diag_status}"
          [ "${diag_status}" = "200" ] || { echo "::error::/diag did not return 200."; fail=1; }

          # Masked values render as "abc***xyz" or "(not set)". A raw connection string,
          # account key or client secret leaking here is a hard failure.
          if grep -qiE 'AccountKey=|SharedAccessSignature=|BEGIN (RSA )?PRIVATE KEY' "${diag_body}"; then
            echo "::error::/diag leaked an unmasked secret value."
            fail=1
          fi
          grep -qE '\*\*\*|\(not set\)' "${diag_body}" \
            || { echo "::error::/diag shows no masked markers — masking may have regressed."; fail=1; }

          rm -f "${home_body}" "${diag_body}"
          exit "${fail}"
