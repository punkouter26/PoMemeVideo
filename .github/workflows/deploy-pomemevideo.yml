name: Build and Deploy PoMemeVideo

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-pomemevideo-master
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'app-pomemevideo' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'PoMemeVideo' }}
  # Statically linked ffmpeg, bundled into the publish output so the app can ship as *code*
  # rather than as a container. Shelling out to ffmpeg/ffprobe is what previously forced a
  # custom Linux container, and a custom container is what forced the plan up to B1.
  # Must be the **gpl** variant: the render pipeline encodes with libx264, which the lgpl
  # builds omit. Pinned by release tag + archive name + SHA-256 — bumping any one of the
  # three means re-deriving the other two.
  FFMPEG_TAG: autobuild-2026-08-13-17-03
  FFMPEG_ARCHIVE: ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1
  FFMPEG_SHA256: 5ca9b490fc4385de7545979e6320608bfbb769242a96e8eb3d45e103082b26d0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Framework-dependent on purpose — App Service supplies the DOTNETCORE|10.0 runtime, which
      # keeps the package ~71 MB instead of carrying a second copy of the framework into a plan
      # whose whole appeal is its 1 GB quota.
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/PoMemeVideo.Api/PoMemeVideo.Api.csproj -c Release -o publish

      - name: Bundle static ffmpeg into the publish output
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_ARCHIVE}.tar.xz"
          echo "${FFMPEG_SHA256}  ffmpeg.tar.xz" | sha256sum -c -

          # FFmpegRenderService looks for exactly this directory next to the app assembly.
          mkdir -p publish/ffmpeg
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C publish/ffmpeg \
            "${FFMPEG_ARCHIVE}/bin/ffmpeg" "${FFMPEG_ARCHIVE}/bin/ffprobe"
          chmod +x publish/ffmpeg/ffmpeg publish/ffmpeg/ffprobe

          publish/ffmpeg/ffmpeg -version | head -1
          publish/ffmpeg/ffmpeg -hide_banner -encoders | grep -q libx264 \
            || { echo "::error::bundled ffmpeg lacks libx264 — wrong build variant"; exit 1; }
          du -sh publish

      # The `zip` CLI records Unix modes in the entry's external attributes; `dotnet publish
      # --output` + Compress-Archive would not. The app re-applies the execute bit at startup
      # anyway, but arriving with it set keeps that path a no-op.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd publish && zip -qr ../package.zip .

      # Secretless OIDC login via the federated credential on the
      # PoShared deployment app registration (subject: refs/heads/master).
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Key Vault auth uses the app's system-assigned managed identity
      # (Key Vault Secrets access on kv-poshared) — no AZURE_CLIENT_ID needed.
      - name: Point the site at the built-in .NET runtime
        shell: bash
        run: |
          set -euo pipefail

          # Always On does not exist below B1; leaving it set blocks assignment to an F1 plan.
          # The startup file is pinned rather than left to auto-detection, which scans the output
          # for an entry assembly and has PoMemeVideo.Client.dll sitting right next to the host.
          az webapp config set \
            --resource-group "${RESOURCE_GROUP}" --name "${WEBAPP_NAME}" \
            --linux-fx-version "DOTNETCORE|10.0" \
            --startup-file "dotnet PoMemeVideo.Api.dll" \
            --always-on false \
            --query "{linuxFxVersion:linuxFxVersion, alwaysOn:alwaysOn, startup:appCommandLine}"

      # No WEBSITE_RUN_FROM_PACKAGE: the read-only mount it creates would block the startup
      # chmod fallback in FFmpegRenderService.
      - name: Deploy package
        shell: bash
        run: |
          set -euo pipefail
          # --clean is explicit: its default is "determined by artifact type", and a merge-style
          # deploy would leave assemblies from earlier builds behind in wwwroot.
          #
          # --async true is deliberate. Synchronous mode waits out the container recycle that
          # OneDeploy triggers after upload, and gives up at 10 minutes — which an F1 cold start
          # of a ~350 MB package blows straight through, failing the step on a deployment that
          # actually succeeded. The health gate below is the real verification.
          az webapp deploy \
            --resource-group "${RESOURCE_GROUP}" --name "${WEBAPP_NAME}" \
            --src-path package.zip --type zip --clean true --async true

      - name: Health check gate
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/health/live"
          echo "Checking ${HEALTH_URL} for HTTP 200"

          # 60 x 15s = 15 min. Generous because this now absorbs the post-deploy container
          # recycle as well, and F1 has no Always On to keep an instance warm.
          for attempt in {1..60}; do
            status_code="$(curl -sS -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || true)"
            echo "Attempt ${attempt}/60: HTTP ${status_code}"

            if [ "${status_code}" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi

            sleep 15
          done

          echo "Health check failed after 60 attempts. Dumping site state:"
          az webapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --query '{state:state, linuxFxVersion:siteConfig.linuxFxVersion}'
          exit 1
