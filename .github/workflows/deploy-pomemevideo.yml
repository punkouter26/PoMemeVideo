name: Build and Deploy PoMemeVideo

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-pomemevideo-master
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pomemevideo
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'app-pomemevideo' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'PoMemeVideo' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Secretless OIDC login via the federated credential on the
      # PoShared deployment app registration (subject: refs/heads/master).
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az webapp config container set` does not reliably persist
      # DOCKER_REGISTRY_SERVER_PASSWORD (observed null after set), which causes
      # ImagePullUnauthorizedFailure at runtime. Write the registry credentials
      # as explicit app settings instead, then point linuxFxVersion at the new
      # image. --query suppresses setting values from the job log.
      # AZURE_CLIENT_ID tells DefaultAzureCredential which user-assigned managed
      # identity to use (the app has no system-assigned identity); without it
      # Key Vault auth fails and startup crashes on missing configuration.
      - name: Configure container image and registry credentials
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --settings \
              DOCKER_REGISTRY_SERVER_URL=https://ghcr.io \
              DOCKER_REGISTRY_SERVER_USERNAME=${{ github.repository_owner }} \
              DOCKER_REGISTRY_SERVER_PASSWORD="${GHCR_PULL_TOKEN}" \
              AZURE_CLIENT_ID=${{ vars.AZURE_UAMI_CLIENT_ID }} \
            --query "[].name" -o tsv

          az webapp config set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --linux-fx-version "DOCKER|${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --query "linuxFxVersion" -o tsv

          az webapp restart \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}"

      - name: Health check gate
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/health"
          echo "Checking ${HEALTH_URL} for HTTP 200"

          for attempt in {1..20}; do
            status_code="$(curl -sS -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || true)"
            echo "Attempt ${attempt}/20: HTTP ${status_code}"

            if [ "${status_code}" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi

            sleep 15
          done

          echo "Health check failed after 20 attempts. Dumping container state:"
          az webapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --query '{state:state, linuxFxVersion:siteConfig.linuxFxVersion}'
          exit 1

      - name: Smoke test frontend and /diag
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${WEBAPP_NAME}.azurewebsites.net"

          home_status="$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}/")"
          echo "GET / -> HTTP ${home_status}"

          diag_status="$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}/diag")"
          echo "GET /diag -> HTTP ${diag_status}"

          [ "${home_status}" = "200" ] && [ "${diag_status}" = "200" ]
