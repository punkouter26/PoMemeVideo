name: Build and Deploy PoMemeVideo

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-pomemevideo-master
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: punkouter26/pomemevideo
  WEBAPP_NAME: app-pomemevideo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Point Web App to new image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group PoMemeVideo \
              --name ${{ env.WEBAPP_NAME }} \
              --container-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --container-registry-url https://ghcr.io \
              --container-registry-user punkouter26 \
              --container-registry-password ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Restart Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart \
              --resource-group PoMemeVideo \
              --name ${{ env.WEBAPP_NAME }}

      - name: Dump Azure Runtime Diagnostics
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "== Web App =="
            az webapp show \
              --resource-group PoMemeVideo \
              --name ${{ env.WEBAPP_NAME }} \
              --query '{state:state, defaultHostName:defaultHostName, linuxFxVersion:siteConfig.linuxFxVersion, lastModifiedTimeUtc:lastModifiedTimeUtc}'

            echo "== Container Config =="
            az webapp config container show \
              --resource-group PoMemeVideo \
              --name ${{ env.WEBAPP_NAME }}

            echo "== App Settings (selected) =="
            az webapp config appsettings list \
              --resource-group PoMemeVideo \
              --name ${{ env.WEBAPP_NAME }} \
              --query "[?name=='WEBSITES_PORT' || name=='ASPNETCORE_ENVIRONMENT' || name=='DOCKER_REGISTRY_SERVER_URL' || name=='DOCKER_REGISTRY_SERVER_USERNAME' || name=='DOCKER_REGISTRY_SERVER_PASSWORD' || name=='KeyVault__Uri']"

      - name: Health Check Gate
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/health"
          echo "Checking ${HEALTH_URL} for HTTP 200"

          for attempt in {1..20}; do
            status_code="$(curl -sS -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || true)"
            echo "Attempt ${attempt}/20: HTTP ${status_code}"

            if [ "${status_code}" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi

            sleep 15
          done

          echo "Health check failed after 20 attempts."
          exit 1